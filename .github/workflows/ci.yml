name: CI

# Compila y prueba la app en los tres sistemas antes de que el cambio llegue a
# main. Sin esto, un error de cfg(windows) o de una lib de Linux se descubre
# recien en el release, que es el peor momento: un solo target roto bloquea la
# publicacion para todos.

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            run_tests: true
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            run_tests: true
          - name: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            run_tests: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libxfixes-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cargo check
        run: cargo check --locked -p datan-app --bin datan-app --target ${{ matrix.target }}

      - name: Cargo test
        if: matrix.run_tests
        run: cargo test --locked --workspace --no-fail-fast
